# 覆盖主配置中的 MySQL，单测使用内存 H2
spring.datasource.url=jdbc:h2:mem:crs;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
crs.billing.retry-interval-ms=3600000
